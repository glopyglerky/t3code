name: Rust port qualification

on:
  push:
    branches: [main, "codex/t3code-ls-hybrid-*"]
  workflow_dispatch:
    inputs:
      full:
        description: Run every fork gate without reusing qualification
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: hybrid-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    name: Select fork checks and porting work
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      native: ${{ steps.plan.outputs.native }}
      adapters: ${{ steps.plan.outputs.adapters }}
      application: ${{ steps.plan.outputs.application }}
      stage_native: ${{ steps.plan.outputs.stage_native }}
      source_guards: ${{ steps.plan.outputs.source_guards }}
      rust_packages: ${{ steps.plan.outputs.rust_packages }}
      adapter_ports: ${{ steps.plan.outputs.adapter_ports }}
      component_tests: ${{ steps.plan.outputs.component_tests }}
      mode: ${{ steps.plan.outputs.mode }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          filter: blob:none
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 26.12.1
      - name: Check qualification selection and immutable porting plans
        run: |
          python3 -m unittest discover -s tools -p 'test_ci*.py'
          python3 -m unittest discover -s tools -p test_nightly.py
          python3 -m unittest discover -s tools -p test_plan_porting.py
          python3 -m unittest discover -s tools -p test_check_lust.py
          node --test \
            tools/install-toolchain.test.mjs \
            tools/native-packaging.test.mjs \
            tools/server-test-runtime-identity.test.mjs \
            tools/fetch-migration-sources.test.mjs \
            tools/hybrid-checks.test.mjs \
            tools/check-acceptance.test.mjs \
            tools/omdb-source.test.mjs
      - name: Plan work against the trusted upstream default branch
        run: python3 tools/plan-porting.py --repo-root "$GITHUB_WORKSPACE" --fetch-default --output "$RUNNER_TEMP/porting-plan.json" --summary "$GITHUB_STEP_SUMMARY"
      - name: Select checks from verified qualification history
        id: plan
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CI_FORCE_FULL: ${{ inputs.full || false }}
        run: |
          arguments=()
          if [[ "$CI_FORCE_FULL" == true ]]; then arguments+=(--full); fi
          python3 tools/ci_plan.py --output "$RUNNER_TEMP/ci-plan.json" --github-output "$GITHUB_OUTPUT" --summary "$GITHUB_STEP_SUMMARY" "${arguments[@]}"
      - name: Retain qualification and porting plans
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ci-plan
          path: |
            ${{ runner.temp }}/ci-plan.json
            ${{ runner.temp }}/porting-plan.json
          if-no-files-found: error
          retention-days: 30

  native:
    name: Affected Rust packages and source guards
    needs: plan
    if: needs.plan.outputs.native == 'true'
    uses: ./.github/workflows/native.yml
    with:
      packages: ${{ needs.plan.outputs.rust_packages }}
      component_tests: ${{ needs.plan.outputs.component_tests }}
      source_guards: ${{ needs.plan.outputs.source_guards == 'true' }}
      stage_native: ${{ needs.plan.outputs.stage_native == 'true' }}

  database_platforms:
    name: Native omdb platform compatibility
    needs: plan
    if: needs.plan.outputs.native == 'true'
    uses: ./.github/workflows/database-platforms.yml

  adapters:
    name: Affected production adapters
    needs: [plan, native]
    if: needs.plan.outputs.adapters == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      T3CODE_DEV_SEED: "0"
      VP_REMOTE_CACHE: "off"
      VP_REMOTE_CACHE_URL: ""
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 26.12.1
          cache: npm
          cache-dependency-path: tools/server-test-runtime/package-lock.json
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: hybrid-native-binaries
          path: bin
      - name: Verify exact-run native executables
        run: node tools/check-hybrid.mjs --verify-binaries
      - name: Fetch the immutable upstream behavior oracle
        run: |
          upstream_commit="$(node -p 'JSON.parse(require("node:fs").readFileSync("upstream.lock.json", "utf8")).upstream.commit')"
          [[ "$upstream_commit" =~ ^[0-9a-f]{40}$ ]]
          git fetch --no-tags --depth=1 https://github.com/pingdotgg/t3code.git "$upstream_commit"
      - name: Install the locked production-adapter test runtime
        run: |
          echo "T3_CODE_LS_TEST_RUNTIME=$RUNNER_TEMP/hybrid-test-runtime" >> "$GITHUB_ENV"
          T3_CODE_LS_TEST_RUNTIME="$RUNNER_TEMP/hybrid-test-runtime" node tools/install-server-tests.mjs
      - name: Check selected Rust adapters, parity and failure paths
        env:
          CI_ADAPTER_PORTS: ${{ needs.plan.outputs.adapter_ports }}
        run: node tools/check-hybrid.mjs --adapters "$RUNNER_TEMP/hybrid-proof" --ports "$CI_ADAPTER_PORTS"
      - name: Retain adapter evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: hybrid-production-adapter-proof
          path: ${{ runner.temp }}/hybrid-proof/*.json
          if-no-files-found: warn
          retention-days: 14

  application:
    name: Rust integration through the application
    needs: [plan, native]
    if: needs.plan.outputs.application == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      T3CODE_DEV_SEED: "0"
      VP_REMOTE_CACHE: "off"
      VP_REMOTE_CACHE_URL: ""
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 26.12.1
      - name: Install the pinned workspace package manager
        run: npm install --global pnpm@12.14.0 --ignore-scripts --no-audit --no-fund
      - name: Locate the dependency store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - name: Cache locked dependency downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ runner.arch }}-12.14.0-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install the locked application dependencies
        run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: hybrid-native-binaries
          path: bin
      - name: Verify exact-run native executables
        run: node tools/check-hybrid.mjs --verify-binaries
      - name: Cache the pinned browser payload
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Prepare Chromium for Rust client integration
        run: |
          # The Azure mirror can time out repeatedly before falling back to this archive.
          if [[ -f /etc/apt/apt-mirrors.txt ]]; then
            sudo sed -i 's|http://azure\.archive\.ubuntu\.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt
          fi
          node apps/web/node_modules/playwright/cli.js install --with-deps --only-shell chromium
      - name: Typecheck native client persistence acceptance
        run: node node_modules/@effect/tsgo/dist/effect-tsgo.cjs tsrs --noEmit -p tools/hybrid-client-persistence-tsconfig.json
      - name: Test fork client acceptance assertions
        run: node --test apps/web/scripts/hybrid-client-turn.test.ts apps/web/scripts/hybrid-client-database.test.ts
      - name: Check native database files stay private
        run: pnpm --filter t3 exec vp test run src/workspace/WorkspaceFileSystem.test.ts src/assets/AssetAccess.test.ts -t 'does not (read|issue URLs for) server state files'
      - name: Check native selection and build the integration bundles
        run: node tools/check-hybrid.mjs --application "$RUNNER_TEMP/hybrid-proof"
      - name: Exercise the client with Rust services and durable recovery
        run: node apps/web/scripts/verify-hybrid-client.ts "$RUNNER_TEMP/hybrid-proof/client" native
      - name: Retain application evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: hybrid-application-proof
          path: |
            ${{ runner.temp }}/hybrid-proof/*.json
            ${{ runner.temp }}/hybrid-proof/client/
          if-no-files-found: warn
          retention-days: 14

  qualification:
    name: Record verified qualification
    needs: [plan, native, database_platforms, adapters, application]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ci-plan
          path: ${{ runner.temp }}/qualification-plan
      - name: Require every planned gate to pass
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
          CI_HEAD: ${{ github.sha }}
          CI_RUN_ID: ${{ github.run_id }}
        run: python3 tools/ci_receipt.py --plan "$RUNNER_TEMP/qualification-plan/ci-plan.json" --output "$RUNNER_TEMP/ci-qualification.json"
      - name: Retain the reusable source qualification receipt
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ci-qualification
          path: ${{ runner.temp }}/ci-qualification.json
          if-no-files-found: error
          retention-days: 30
