name: Rust port qualification

on:
  push:
    branches: [main, "codex/t3code-ls-hybrid-*", "ci/*"]
  workflow_dispatch:
    inputs:
      full:
        description: Run every fork gate without reusing qualification
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: hybrid-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    name: Select fork checks and porting work
    runs-on: ${{ ((github.event_name != 'pull_request' && github.event_name != 'pull_request_target') || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON(vars.CI_RUNNER_ROUTES || '{}')['ubuntu-24.04'] || 'ubuntu-24.04' }}
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      native: ${{ steps.plan.outputs.native }}
      adapters: ${{ steps.plan.outputs.adapters }}
      application: ${{ steps.plan.outputs.application }}
      performance: ${{ steps.plan.outputs.performance }}
      stage_native: ${{ steps.plan.outputs.stage_native }}
      source_guards: ${{ steps.plan.outputs.source_guards }}
      rust_packages: ${{ steps.plan.outputs.rust_packages }}
      adapter_ports: ${{ steps.plan.outputs.adapter_ports }}
      component_tests: ${{ steps.plan.outputs.component_tests }}
      mode: ${{ steps.plan.outputs.mode }}
      plan_artifact: ${{ steps.plan.outputs.artifact_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          filter: blob:none
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 26.12.1
      - name: Check qualification selection and immutable porting plans
        run: |
          python3 -m unittest discover -s tools -p 'test_ci*.py'
          python3 -m unittest discover -s tools -p test_nightly.py
          python3 -m unittest discover -s tools -p test_plan_porting.py
          node --test \
            tools/install-toolchain.test.mjs \
            tools/native-packaging.test.mjs \
            tools/fetch-migration-sources.test.mjs \
            tools/hybrid-checks.test.mjs \
            tools/check-acceptance.test.mjs \
            tools/omdb-source.test.mjs \
            tools/link-performance-runtime.test.mjs \
            tools/performance-compiler.test.mjs \
            tools/performance-statistics.test.mjs \
            tools/performance-memory.test.mjs \
            tools/performance-filesystem.test.mjs
      - name: Plan work against the trusted upstream default branch
        run: python3 tools/plan-porting.py --repo-root "$GITHUB_WORKSPACE" --fetch-default --output "$RUNNER_TEMP/porting-plan.json" --summary "$GITHUB_STEP_SUMMARY"
      - name: Select checks from verified qualification history
        id: plan
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CI_FORCE_FULL: ${{ inputs.full || false }}
        run: |
          arguments=()
          if [[ "$CI_FORCE_FULL" == true ]]; then arguments+=(--full); fi
          python3 tools/ci_plan.py --output "$RUNNER_TEMP/ci-plan.json" --github-output "$GITHUB_OUTPUT" --summary "$GITHUB_STEP_SUMMARY" "${arguments[@]}"
          echo "artifact_name=ci-plan-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - name: Retain qualification and porting plans
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ steps.plan.outputs.artifact_name }}
          path: |
            ${{ runner.temp }}/ci-plan.json
            ${{ runner.temp }}/porting-plan.json
          if-no-files-found: error
          retention-days: 30

  native:
    name: Affected Rust packages and source guards
    needs: plan
    if: needs.plan.outputs.native == 'true'
    uses: ./.github/workflows/native.yml
    with:
      packages: ${{ needs.plan.outputs.rust_packages }}
      component_tests: ${{ needs.plan.outputs.component_tests }}
      source_guards: ${{ needs.plan.outputs.source_guards == 'true' }}
      stage_native: ${{ needs.plan.outputs.stage_native == 'true' }}

  adapters:
    name: Affected production adapters
    needs: [plan, native]
    if: needs.plan.outputs.adapters == 'true'
    runs-on: ${{ ((github.event_name != 'pull_request' && github.event_name != 'pull_request_target') || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON(vars.CI_RUNNER_ROUTES || '{}')['ubuntu-24.04'] || 'ubuntu-24.04' }}
    timeout-minutes: 15
    env:
      T3CODE_DEV_SEED: "0"
      VP_REMOTE_CACHE: "off"
      VP_REMOTE_CACHE_URL: ""
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 26.12.1
          cache: npm
          cache-dependency-path: tools/server-test-runtime/package-lock.json
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ${{ needs.native.outputs.native_artifact }}
          path: bin
      - name: Verify exact-run native executables
        run: node tools/check-hybrid.mjs --verify-binaries
      - name: Fetch the immutable upstream behavior oracle
        run: |
          upstream_commit="$(node -p 'JSON.parse(require("node:fs").readFileSync("upstream.lock.json", "utf8")).upstream.commit')"
          [[ "$upstream_commit" =~ ^[0-9a-f]{40}$ ]]
          git fetch --no-tags --depth=1 https://github.com/pingdotgg/t3code.git "$upstream_commit"
      - name: Install the locked production-adapter test runtime
        run: |
          echo "T3_CODE_LS_TEST_RUNTIME=$RUNNER_TEMP/hybrid-test-runtime" >> "$GITHUB_ENV"
          T3_CODE_LS_TEST_RUNTIME="$RUNNER_TEMP/hybrid-test-runtime" node tools/install-server-tests.mjs
      - name: Check selected Rust adapters, parity and failure paths
        env:
          CI_ADAPTER_PORTS: ${{ needs.plan.outputs.adapter_ports }}
        run: node tools/check-hybrid.mjs --adapters "$RUNNER_TEMP/hybrid-proof" --ports "$CI_ADAPTER_PORTS"
      - name: Retain adapter evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: hybrid-production-adapter-proof-${{ github.run_attempt }}
          path: ${{ runner.temp }}/hybrid-proof/*.json
          if-no-files-found: warn
          retention-days: 14

  application:
    name: Rust integration through the application
    needs: [plan, native]
    if: needs.plan.outputs.application == 'true'
    runs-on: ${{ ((github.event_name != 'pull_request' && github.event_name != 'pull_request_target') || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON(vars.CI_RUNNER_ROUTES || '{}')['ubuntu-24.04'] || 'ubuntu-24.04' }}
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    env:
      T3CODE_DEV_SEED: "0"
      VP_REMOTE_CACHE: "off"
      VP_REMOTE_CACHE_URL: ""
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          filter: blob:none
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 26.12.1
      - name: Install the pinned workspace package manager
        run: npm install --global pnpm@12.14.0 --ignore-scripts --no-audit --no-fund
      - name: Locate the dependency store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - name: Cache locked dependency downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ runner.arch }}-12.14.0-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install the locked application dependencies
        run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ${{ needs.plan.outputs.plan_artifact }}
          path: ${{ runner.temp }}/application-plan
      - name: Run the normal candidate hooks
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git checkout --detach "$GITHUB_SHA"
          python3 tools/ci_commit_hooks.py --plan "$RUNNER_TEMP/application-plan/ci-plan.json" --output "$RUNNER_TEMP/commit-hook-proof/proof.json"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ${{ needs.native.outputs.native_artifact }}
          path: bin
      - name: Verify exact-run native executables
        run: node tools/check-hybrid.mjs --verify-binaries
      - name: Cache the pinned browser payload
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Prepare Chromium for Rust client integration
        run: |
          # The Azure mirror can time out repeatedly before falling back to this archive.
          if [[ -f /etc/apt/apt-mirrors.txt ]]; then
            sudo sed -i 's|http://azure\.archive\.ubuntu\.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt
          fi
          node apps/web/node_modules/playwright/cli.js install --with-deps --only-shell chromium
      - name: Typecheck native client persistence acceptance
        run: node node_modules/@effect/tsgo/dist/effect-tsgo.cjs tsrs --noEmit -p tools/hybrid-client-persistence-tsconfig.json
      - name: Test fork client acceptance assertions
        run: node --test apps/web/scripts/hybrid-client-turn.test.ts apps/web/scripts/hybrid-client-database.test.ts apps/web/scripts/hybrid-client-browser-diagnostics.test.ts
      - name: Check native selection and build the integration bundles
        run: node tools/check-hybrid.mjs --application "$RUNNER_TEMP/hybrid-proof"
      - name: Exercise the client with Rust services and durable recovery
        run: node apps/web/scripts/verify-hybrid-client.ts "$RUNNER_TEMP/hybrid-proof/client" native
      - name: Retain application evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: hybrid-application-proof-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/commit-hook-proof/
            ${{ runner.temp }}/hybrid-proof/*.json
            ${{ runner.temp }}/hybrid-proof/client/
          if-no-files-found: warn
          retention-days: 14

  performance:
    name: Paired stock and native performance and reliability
    needs: [plan, native]
    if: needs.plan.outputs.performance == 'true'
    runs-on: ${{ ((github.event_name != 'pull_request' && github.event_name != 'pull_request_target') || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON(vars.CI_RUNNER_ROUTES || '{}')['ubuntu-24.04'] || 'ubuntu-24.04' }}
    timeout-minutes: 45
    outputs:
      proof_sha256: ${{ steps.proof.outputs.proof_sha256 }}
      proof_run_attempt: ${{ steps.proof.outputs.proof_run_attempt }}
    env:
      T3CODE_DEV_SEED: "0"
      VP_REMOTE_CACHE: "off"
      VP_REMOTE_CACHE_URL: ""
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 26.12.1
      - name: Install the pinned workspace package manager
        run: npm install --global pnpm@12.14.0 --ignore-scripts --no-audit --no-fund
      - name: Locate the dependency store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - name: Cache locked dependency downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ runner.arch }}-12.14.0-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install the locked application dependencies
        run: pnpm install --frozen-lockfile
      - name: Link comparison imports from the production workspace
        run: node tools/link-performance-runtime.mjs
      - name: Check installed runtime provenance rejection paths
        run: node --test tools/performance-runtime.test.mjs
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ${{ needs.native.outputs.native_artifact }}
          path: bin
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ${{ needs.plan.outputs.plan_artifact }}
          path: ${{ runner.temp }}/performance-plan
      - name: Verify the exact-run release helpers
        run: node tools/check-hybrid.mjs --verify-binaries
      - name: Fetch the immutable stock comparison
        run: |
          upstream_commit="$(node -p 'JSON.parse(require("node:fs").readFileSync("upstream.lock.json", "utf8")).upstream.commit')"
          [[ "$upstream_commit" =~ ^[0-9a-f]{40}$ ]]
          git fetch --no-tags --depth=1 https://github.com/pingdotgg/t3code.git "$upstream_commit"
      - name: Compare correctness, durability and every fixed workload
        run: |
          node tools/performance-persistence.mjs \
            --database "$GITHUB_WORKSPACE/bin/t3-code-ls-db" \
            --manifest "$GITHUB_WORKSPACE/bin/manifest.json" \
            --plan "$RUNNER_TEMP/performance-plan/ci-plan.json" \
            --output "$RUNNER_TEMP/performance-proof-$GITHUB_RUN_ATTEMPT" \
            --mode qualify
      - name: Bind the performance report to this job
        id: proof
        run: |
          python3 - <<'PYCODE'
          import hashlib, os
          from pathlib import Path
          report = Path(os.environ["RUNNER_TEMP"]) / ("performance-proof-" + os.environ["GITHUB_RUN_ATTEMPT"]) / "performance.json"
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write("proof_sha256=" + hashlib.sha256(report.read_bytes()).hexdigest() + "\n")
              output.write("proof_run_attempt=" + os.environ["GITHUB_RUN_ATTEMPT"] + "\n")
          PYCODE
      - name: Publish every measured speedup and slowdown
        if: always()
        run: |
          report="$RUNNER_TEMP/performance-proof-$GITHUB_RUN_ATTEMPT/performance.md"
          if [[ -f "$report" ]]; then cat "$report" >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Retain raw samples, failures and comparison decisions
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: hybrid-performance-proof-${{ github.run_attempt }}
          path: ${{ runner.temp }}/performance-proof-${{ github.run_attempt }}/
          if-no-files-found: warn
          retention-days: 30

  qualification:
    name: Record verified qualification
    needs: [plan, native, adapters, application, performance]
    if: always()
    runs-on: ${{ ((github.event_name != 'pull_request' && github.event_name != 'pull_request_target') || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON(vars.CI_RUNNER_ROUTES || '{}')['ubuntu-24.04'] || 'ubuntu-24.04' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
          filter: blob:none
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        if: needs.plan.result == 'success'
        with:
          name: ${{ needs.plan.outputs.plan_artifact }}
          path: ${{ runner.temp }}/qualification-plan
      - name: Download the successful performance job's exact evidence
        if: needs.plan.outputs.performance == 'true' && needs.performance.result == 'success'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: hybrid-performance-proof-${{ needs.performance.outputs.proof_run_attempt }}
          path: ${{ runner.temp }}/qualification-performance
      - name: Require every planned gate and its evidence to pass
        if: always()
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
          CI_HEAD: ${{ github.sha }}
          CI_RUN_ID: ${{ github.run_id }}
          CI_RUN_ATTEMPT: ${{ github.run_attempt }}
          CI_PERFORMANCE: ${{ needs.plan.outputs.performance == 'true' && needs.performance.result == 'success' }}
        run: |
          arguments=()
          if [[ "$CI_PERFORMANCE" == true ]]; then
            arguments+=(--performance "$RUNNER_TEMP/qualification-performance/performance.json")
          fi
          python3 tools/ci_receipt.py --plan "$RUNNER_TEMP/qualification-plan/ci-plan.json" --output "$RUNNER_TEMP/ci-qualification.json" "${arguments[@]}"
      - name: Retain the reusable source qualification receipt
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ci-qualification-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-qualification.json
          if-no-files-found: error
          retention-days: 30
