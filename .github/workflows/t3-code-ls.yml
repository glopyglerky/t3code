  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: t3-code-ls-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: Native transport and application behavior
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: .
    steps:
      - name: Check out the exact public source
        working-directory: ${{ github.workspace }}
        env:
          SOURCE_REPOSITORY: ${{ github.repository }}
          SOURCE_REVISION: ${{ github.sha }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          git init .
          git remote add origin "https://github.com/${SOURCE_REPOSITORY}.git"
          git -c credential.helper= fetch --no-tags --depth=1 origin "$SOURCE_REVISION"
          git sparse-checkout set --cone crates tools packages patches apps/server
          git checkout --detach FETCH_HEAD
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 26.12.1
      - name: Install the locked application test runtime
        run: node tools/install-server-tests.mjs
      - name: Fetch the immutable upstream comparison source
        run: |
          upstream_commit="$(python3 -c 'import json, re; value = json.load(open("upstream.lock.json"))["upstream"]["commit"]; assert re.fullmatch("[0-9a-f]{40}", value); print(value)')"
          git fetch --no-tags --depth 1 https://github.com/pingdotgg/t3code.git "$upstream_commit"
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt,clippy
      - name: Check the unchanged upstream README
        run: python3 tools/sync-readme.py
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check native code
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test native code
        run: cargo test --locked --all-targets
      - name: Stage required default decision executables
        run: |
          cargo build --locked -p t3-code-ls-core --bins
          mkdir -p bin
          for component in policy project guest-share recovery maintenance provider generate; do cp "target/debug/t3-code-ls-$component" bin/; done
      - name: Compare permissions with the actual upstream functions
        run: node --disable-warning=ExperimentalWarning tools/check-permissions.mjs
      - name: Compare connection retry policy with the actual upstream functions
        run: node --disable-warning=ExperimentalWarning tools/check-connection.mjs
      - name: Compare provider capabilities with the actual upstream functions
        run: node --disable-warning=ExperimentalWarning tools/check-policy.mjs
      - name: Compare dispatch and goal policy with the actual upstream functions
        run: node --disable-warning=ExperimentalWarning tools/check-dispatch.mjs
      - name: Compare the guest share lifecycle with the actual upstream functions
        run: node --disable-warning=ExperimentalWarning tools/check-guest-share.mjs
      - name: Verify the bounded guest-share executable
        run: |
          cargo build --locked -p t3-code-ls-core --bin t3-code-ls-guest-share
          node --disable-warning=ExperimentalWarning tools/check-guest-share-runtime.mjs target/debug/t3-code-ls-guest-share
      - name: Compare project commands with the actual upstream planner
        run: |
          cargo build --locked -p t3-code-ls-core --example project_commands_matrix
          node --disable-warning=ExperimentalWarning tools/check-project-commands.mjs target/debug/examples/project_commands_matrix
      - name: Verify the bounded project-command executable
        run: |
          cargo build --locked -p t3-code-ls-core --bin t3-code-ls-project
          node --disable-warning=ExperimentalWarning tools/check-project-runtime.mjs target/debug/t3-code-ls-project
      - name: Compare native project projections with the actual upstream SQLite store
        run: |
          cargo build --locked -p t3-code-ls-core --example project_persistence_matrix --bin t3-code-ls-project-store
          node --disable-warning=ExperimentalWarning tools/check-project-persistence.mjs target/debug/examples/project_persistence_matrix target/debug/t3-code-ls-project-store
      - name: Compare provider install ownership with immutable upstream
        run: |
          cargo build --locked -p t3-code-ls-core --bin t3-code-ls-maintenance
          node --disable-warning=ExperimentalWarning tools/check-maintenance.mjs "$PWD/target/debug/t3-code-ls-maintenance"
          node --disable-warning=ExperimentalWarning tools/check-maintenance-runtime.mjs "$PWD/target/debug/t3-code-ls-maintenance"
      - name: Compare and exercise Codex structured generation
        run: |
          cargo build --locked -p t3-code-ls-core --bin t3-code-ls-generate
          node --disable-warning=ExperimentalWarning tools/check-generation.mjs "$PWD/target/debug/t3-code-ls-generate"
          node --disable-warning=ExperimentalWarning tools/check-generation-runtime.mjs "$PWD/target/debug/t3-code-ls-generate"
      - name: Compare recovery events with the actual upstream functions
        run: |
          cargo build --locked -p t3-code-ls-core --example provider_recovery_matrix
          node --disable-warning=ExperimentalWarning tools/check-provider-recovery.mjs target/debug/examples/provider_recovery_matrix
      - name: Verify the bounded recovery executable
        run: |
          cargo build --locked -p t3-code-ls-core --bin t3-code-ls-recovery
          node --disable-warning=ExperimentalWarning tools/check-recovery-runtime.mjs target/debug/t3-code-ls-recovery
      - name: Verify JSON wire compatibility
        run: node tools/check-json.mjs
      - name: Exercise the provider subprocess protocol
        run: |
          cargo build --locked -p t3-code-ls-core --bin t3-code-ls-provider
          node tools/check-provider.mjs target/debug/t3-code-ls-provider
      - name: Test nightly selection and complete source comparison
        run: python3 -m unittest discover -s tools -p 'test_*.py'
      - name: Build the bridge executable
        run: cargo build --locked -p t3-code-ls-transport --bin t3-code-ls
      - name: Verify against the official nightly runtime
        run: |
          curl --fail --location --retry 3 \
            https://github.com/pingdotgg/t3code/releases/download/v0.1.8-nightly.20261109.4392/t3-0.1.8-nightly.20261109.4392-linux-x64.tar.gz \
            --output "$RUNNER_TEMP/t3-nightly-linux-x64.tar.gz"
          echo "bf62906d81fa9a641d2f512d9082e71a77a86afc078b46c2c3a28a9462d9a55a  $RUNNER_TEMP/t3-nightly-linux-x64.tar.gz" | sha256sum --check --
          python3 tools/verify-upstream.py \
            --archive "$RUNNER_TEMP/t3-nightly-linux-x64.tar.gz" \
            --output "$RUNNER_TEMP/t3-code-ls-upstream-verification.json"
      - name: Retain runtime verification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: t3-code-ls-upstream-verification
          path: ${{ runner.temp }}/t3-code-ls-upstream-verification.json
          if-no-files-found: ignore
          retention-days: 14

  lust:
    name: Pinned Lust compilation and behavioral parity
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: .
    steps:
      - name: Check out the exact public source
        working-directory: ${{ github.workspace }}
        env:
          SOURCE_REPOSITORY: ${{ github.repository }}
          SOURCE_REVISION: ${{ github.sha }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          git init .
          git remote add origin "https://github.com/${SOURCE_REPOSITORY}.git"
          git -c credential.helper= fetch --no-tags --depth=1 origin "$SOURCE_REVISION"
          git sparse-checkout set --cone crates tools packages apps/server patches
          git checkout --detach FETCH_HEAD
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 26.12.1
      - name: Install the locked application test runtime
        run: node tools/install-server-tests.mjs
      - name: Fetch the immutable upstream comparison source
        run: |
          upstream_commit="$(python3 -c 'import json, re; value = json.load(open("upstream.lock.json"))["upstream"]["commit"]; assert re.fullmatch("[0-9a-f]{40}", value); print(value)')"
          git fetch --no-tags --depth 1 https://github.com/pingdotgg/t3code.git "$upstream_commit"
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal
      - name: Fetch the pinned Lustr compiler
        run: |
          git init "$RUNNER_TEMP/lust-lang"
          git -C "$RUNNER_TEMP/lust-lang" remote add origin https://github.com/glopyglerky/lustr.git
          git -C "$RUNNER_TEMP/lust-lang" fetch --depth 1 origin 6339fbb104d6adda4be7e6be7dc637a6a9e5586b
          git -C "$RUNNER_TEMP/lust-lang" checkout --detach FETCH_HEAD
      - name: Compile and execute application code through Lust
        run: |
          python3 tools/check-lust.py --source "$RUNNER_TEMP/lust-lang" --artifacts target/lust-bin
          mkdir -p bin
          cp target/lust-bin/* bin/
      - name: Typecheck the server-policy integration
        run: |
          tools/server-test-runtime/node_modules/.bin/effect-tsgo tsrs --noEmit --project tools/policy-tsconfig.json
      - name: Typecheck the actual Codex provider and session integration
        run: |
          tools/server-test-runtime/node_modules/.bin/effect-tsgo tsrs --noEmit --project tools/provider-tsconfig.json
      - name: Typecheck recovery and its production orchestration callers
        run: |
          tools/server-test-runtime/node_modules/.bin/effect-tsgo tsrs --noEmit --project tools/recovery-tsconfig.json
      - name: Typecheck guest sharing and its production callers
        run: |
          tools/server-test-runtime/node_modules/.bin/effect-tsgo tsrs --noEmit --project tools/guest-share-tsconfig.json
      - name: Typecheck project commands and their production callers
        run: |
          tools/server-test-runtime/node_modules/.bin/effect-tsgo tsrs --noEmit --project tools/project-tsconfig.json
      - name: Typecheck provider maintenance and its production callers
        run: tools/server-test-runtime/node_modules/.bin/effect-tsgo tsrs --noEmit --project tools/maintenance-tsconfig.json
      - name: Typecheck structured generation and its production callers
        run: tools/server-test-runtime/node_modules/.bin/effect-tsgo tsrs --noEmit --project tools/generation-tsconfig.json
      - name: Exercise the actual server-policy service with a Lust-built executable
        run: |
          mkdir -p target/lust
          node --disable-warning=ExperimentalWarning tools/check-policy.mjs "$PWD/target/lust-bin/t3-code-ls-policy"
          node --disable-warning=ExperimentalWarning tools/check-policy-adapter.mjs \
            "$PWD/target/lust-bin/t3-code-ls-policy" "$PWD/target/lust/policy-adapter-proof.json"
          node --disable-warning=ExperimentalWarning tools/check-dispatch.mjs \
            "$PWD/target/lust-bin/t3-code-ls-policy" --service "$PWD/target/lust/dispatch-proof.json"
          sha256sum target/lust-bin/t3-code-ls-policy
      - name: Exercise the actual Codex provider and session factory with Lust
        run: |
          node --disable-warning=ExperimentalWarning tools/check-provider-adapter.mjs \
            "$PWD/target/lust-bin/t3-code-ls-provider" "$PWD/target/lust/provider-adapter-proof.json"
      - name: Verify Lust recovery through the actual SQLite event sink
        run: |
          node --disable-warning=ExperimentalWarning tools/check-recovery-adapter.mjs \
            "$PWD/target/lust-bin/t3-code-ls-recovery" "$PWD/target/lust/recovery-adapter-proof.json"
      - name: Verify Lust guest sharing through the actual service and SQLite event sink
        run: |
          node --disable-warning=ExperimentalWarning tools/check-guest-share-adapter.mjs \
            "$PWD/target/lust-bin/t3-code-ls-guest-share" "$PWD/target/lust/guest-share-adapter-proof.json"
      - name: Verify Lust project commands through the actual service and SQLite event sink
        run: |
          node --disable-warning=ExperimentalWarning tools/check-project-adapter.mjs \
            "$PWD/target/lust-bin/t3-code-ls-project" "$PWD/target/lust/project-adapter-proof.json"
      - name: Verify Lust ownership resolution through the actual provider update runner
        run: |
          node --disable-warning=ExperimentalWarning tools/check-maintenance-adapter.mjs \
            "$PWD/target/lust-bin/t3-code-ls-maintenance" "$PWD/target/lust/maintenance-adapter-proof.json"
      - name: Verify Lust generation through the production text-generation service
        run: |
          node --disable-warning=ExperimentalWarning tools/check-generation-adapter.mjs \
            "$PWD/target/lust-bin/t3-code-ls-generate" "$PWD/target/lust/generation-adapter-proof.json"
      - name: Package the verified Linux components with their receipt
        run: |
          tar -czf target/t3-code-ls-lust-linux-x64.tar.gz -C target lust-bin lust-proof.json lust/policy-adapter-proof.json lust/dispatch-proof.json lust/provider-adapter-proof.json lust/recovery-adapter-proof.json lust/guest-share-adapter-proof.json lust/project-adapter-proof.json lust/maintenance-adapter-proof.json lust/generation-adapter-proof.json
          sha256sum target/t3-code-ls-lust-linux-x64.tar.gz > target/t3-code-ls-lust-linux-x64.tar.gz.sha256
      - name: Retain the verified Linux Lust executables
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: t3-code-ls-lust-linux-x64
          path: |
            target/t3-code-ls-lust-linux-x64.tar.gz
            target/t3-code-ls-lust-linux-x64.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14
      - name: Retain Lust execution evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: t3-code-ls-lust-proof
          path: |
            target/lust-proof.json
            target/lust/policy-adapter-proof.json
            target/lust/dispatch-proof.json
            target/lust/provider-adapter-proof.json
            target/lust/recovery-adapter-proof.json
            target/lust/guest-share-adapter-proof.json
            target/lust/project-adapter-proof.json
            target/lust/maintenance-adapter-proof.json
            target/lust/generation-adapter-proof.json
            tools/server-test-runtime/package-lock.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Retain the verified Lust policy executable
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: t3-code-ls-policy-linux-x64
          path: target/lust-bin/t3-code-ls-policy
          if-no-files-found: error
          retention-days: 14

  database:
    name: Rust database concurrency, outbox recovery, and Lust persistence
    needs: lust
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: .
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
    steps:
      - name: Check out the exact public source
        working-directory: ${{ github.workspace }}
        env:
          SOURCE_REPOSITORY: ${{ github.repository }}
          SOURCE_REVISION: ${{ github.sha }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          git init .
          git remote add origin "https://github.com/${SOURCE_REPOSITORY}.git"
          git -c credential.helper= fetch --no-tags --depth=1 origin "$SOURCE_REVISION"
          git sparse-checkout set --cone crates tools packages patches apps/server
          git checkout --detach FETCH_HEAD
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 26.12.1
      - name: Install the locked application test runtime
        run: node tools/install-server-tests.mjs
      - name: Fetch the immutable upstream comparison source
        run: |
          upstream_commit="$(python3 -c 'import json, re; value = json.load(open("upstream.lock.json"))["upstream"]["commit"]; assert re.fullmatch("[0-9a-f]{40}", value); print(value)')"
          git fetch --no-tags --depth 1 https://github.com/pingdotgg/t3code.git "$upstream_commit"
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt,clippy
      - name: Download the verified Lust components from this exact workflow run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: t3-code-ls-lust-linux-x64
          path: target
      - name: Unpack and verify the selected Lust executable
        run: |
          sha256sum --check target/t3-code-ls-lust-linux-x64.tar.gz.sha256
          tar -xzf target/t3-code-ls-lust-linux-x64.tar.gz -C target
          mkdir -p bin
          cp target/lust-bin/* bin/
          test -x target/lust-bin/t3-code-ls-project-store
          test -x target/lust-bin/t3-code-ls-outbox
      - name: Select isolated database test storage
        run: echo "T3_CODE_LS_TEST_TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Verify the embedded database pin
        run: |
          python3 - <<'PY'
          import json, tomllib
          from pathlib import Path
          pin = json.loads(Path("database.lock.json").read_text())
          manifest = tomllib.loads(Path("crates/storage/Cargo.toml").read_text())
          lock = tomllib.loads(Path("Cargo.lock").read_text())
          engine = [p for p in lock["package"] if p["name"] == "redb"]
          assert pin["product"] == pin["crate"]["name"] == "redb"
          assert manifest["dependencies"]["redb"] == "=" + pin["version"]
          assert len(engine) == 1 and engine[0]["version"] == pin["version"] == pin["crate"]["version"]
          assert engine[0]["checksum"] == pin["crate"]["sha256"]
          assert pin["license"] == "MIT OR Apache-2.0"
          PY
      - name: Check database code
        run: cargo clippy --locked -p t3-code-ls-storage --all-targets -- -D warnings
      - name: Test real database transactions and recovery
        run: cargo test --locked -p t3-code-ls-storage --all-targets -- --test-threads=2
      - name: Typecheck the native database and actual effect worker
        run: tools/server-test-runtime/node_modules/.bin/effect-tsgo tsrs --noEmit --project tools/outbox-tsconfig.json
      - name: Verify the persistent server database client protocol
        run: node --disable-warning=ExperimentalWarning tools/check-native-database.mjs "$PWD/target/native-database-proof.json"
      - name: Test read-only SQLite export and exact typed values
        run: node --disable-warning=ExperimentalWarning --test tools/export-sqlite-state.test.mjs
      - name: Verify independent clients, Lust persistence, crash and archive recovery
        run: |
          cargo build --locked -p t3-code-ls-storage --bin t3-code-ls-db
          node --disable-warning=ExperimentalWarning tools/check-database.mjs \
            "$PWD/target/debug/t3-code-ls-db" "$PWD/target/lust-bin/t3-code-ls-project-store" \
            "$PWD/target/database-proof.json"
      - name: Compare complete outbox lifecycles with immutable upstream SQLite
        run: |
          node --disable-warning=ExperimentalWarning tools/check-outbox.mjs \
            "$PWD/target/debug/t3-code-ls-db" "$PWD/target/lust-bin/t3-code-ls-outbox" \
            "$PWD/target/outbox-proof.json"
      - name: Recover committed claims after lost responses and process death
        run: |
          node --disable-warning=ExperimentalWarning tools/check-outbox-claim-recovery.mjs \
            "$PWD/target/debug/t3-code-ls-db" "$PWD/target/outbox-claim-recovery-proof.json"
      - name: Exercise the actual effect worker through the native database adapter
        run: |
          node --disable-warning=ExperimentalWarning tools/check-native-outbox-worker.mjs \
            "$PWD/target/debug/t3-code-ls-db" "$PWD/target/native-outbox-worker-proof.json"
      - name: Package the verified database client and receipt
        run: |
          tar -czf target/t3-code-ls-database-linux-x64.tar.gz \
            database.lock.json -C target database-proof.json outbox-proof.json lust-proof.json \
            native-database-proof.json outbox-claim-recovery-proof.json native-outbox-worker-proof.json \
            -C debug t3-code-ls-db
          sha256sum target/t3-code-ls-database-linux-x64.tar.gz > target/t3-code-ls-database-linux-x64.tar.gz.sha256
      - name: Retain database verification and Linux client
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: t3-code-ls-database-linux-x64
          path: |
            target/database-proof.json
            target/outbox-proof.json
            target/native-database-proof.json
            target/outbox-claim-recovery-proof.json
            target/native-outbox-worker-proof.json
            target/t3-code-ls-database-linux-x64.tar.gz
            target/t3-code-ls-database-linux-x64.tar.gz.sha256
          if-no-files-found: ignore
          retention-days: 14

  portable-core:
    name: Portable core target checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: .
    steps:
      - name: Check out the exact public source
        working-directory: ${{ github.workspace }}
        env:
          SOURCE_REPOSITORY: ${{ github.repository }}
          SOURCE_REVISION: ${{ github.sha }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          git init .
          git remote add origin "https://github.com/${SOURCE_REPOSITORY}.git"
          git -c credential.helper= fetch --no-tags --depth=1 origin "$SOURCE_REVISION"
          git sparse-checkout set --cone crates tools packages/contracts packages/client-runtime apps/server/src/orchestration-v2
          git checkout --detach FETCH_HEAD
      - name: Install mobile, Windows, and WebAssembly standard libraries
        run: |
          rustup toolchain install 1.99.1 --profile minimal
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim aarch64-linux-android x86_64-pc-windows-gnu wasm32-unknown-unknown
      - name: Check the core on each target
        run: |
          for target in aarch64-apple-ios aarch64-apple-ios-sim aarch64-linux-android x86_64-pc-windows-gnu wasm32-unknown-unknown; do
            cargo check --locked -p t3-code-ls-core --target "$target"
          done
