name: t3 code ls

on:
  push:
    branches: [main, t3-code-ls, "codex/t3-code-ls-*"]
    paths:
      - README.md
      - docs/internals/t3-code-ls.md
      - native/t3-code-ls/**
      - packages/contracts/src/auth.ts
      - apps/server/src/orchestration-v2/CommandPolicy.ts
      - apps/server/src/orchestration-v2/NativeCommandPolicy.ts
      - apps/server/src/orchestration-v2/NativeDispatchFacts.ts
      - apps/server/src/orchestration-v2/NativeDispatchPolicy.ts
      - apps/server/src/orchestration-v2/NativeGuestShare.ts
      - apps/server/src/orchestration-v2/GuestShareDecider.ts
      - apps/server/src/guest/**
      - apps/server/src/project/**
      - apps/server/src/orchestration-v2/NativeProjectCommands.ts
      - apps/server/src/orchestration-v2/ProjectCommands.ts
      - apps/server/src/orchestration-v2/ProjectStore.ts
      - packages/contracts/src/applicationEvent.ts
      - packages/contracts/src/baseSchemas.ts
      - packages/contracts/src/keybindings.ts
      - packages/contracts/src/project.ts
      - apps/server/src/orchestration-v2/Orchestrator.ts
      - apps/server/src/orchestration-v2/ProviderRecoveryPlanner.ts
      - apps/server/src/orchestration-v2/ProviderRuntimeRecoveryService.ts
      - apps/server/src/processRunner.ts
      - apps/server/src/orchestration-v2/Adapters/CodexAdapterV2.ts
      - apps/server/src/provider/CodexAppServerProcess.ts
      - apps/server/src/provider/CodexProvider.ts
      - packages/effect-codex-app-server/**
      - packages/provider-core/src/server/subagentProjection.ts
      - packages/contracts/src/orchestrationV2.ts
      - packages/contracts/src/guestShare.ts
      - patches/**
      - tsconfig.base.json
      - .github/workflows/t3-code-ls.yml
  pull_request:
    paths:
      - README.md
      - docs/internals/t3-code-ls.md
      - native/t3-code-ls/**
      - packages/contracts/src/auth.ts
      - apps/server/src/orchestration-v2/CommandPolicy.ts
      - apps/server/src/orchestration-v2/NativeCommandPolicy.ts
      - apps/server/src/orchestration-v2/NativeDispatchFacts.ts
      - apps/server/src/orchestration-v2/NativeDispatchPolicy.ts
      - apps/server/src/orchestration-v2/NativeGuestShare.ts
      - apps/server/src/orchestration-v2/GuestShareDecider.ts
      - apps/server/src/guest/**
      - apps/server/src/project/**
      - apps/server/src/orchestration-v2/NativeProjectCommands.ts
      - apps/server/src/orchestration-v2/ProjectCommands.ts
      - apps/server/src/orchestration-v2/ProjectStore.ts
      - packages/contracts/src/applicationEvent.ts
      - packages/contracts/src/baseSchemas.ts
      - packages/contracts/src/keybindings.ts
      - packages/contracts/src/project.ts
      - apps/server/src/orchestration-v2/Orchestrator.ts
      - apps/server/src/orchestration-v2/ProviderRecoveryPlanner.ts
      - apps/server/src/orchestration-v2/ProviderRuntimeRecoveryService.ts
      - apps/server/src/processRunner.ts
      - apps/server/src/orchestration-v2/Adapters/CodexAdapterV2.ts
      - apps/server/src/provider/CodexAppServerProcess.ts
      - apps/server/src/provider/CodexProvider.ts
      - packages/effect-codex-app-server/**
      - packages/provider-core/src/server/subagentProjection.ts
      - packages/contracts/src/orchestrationV2.ts
      - packages/contracts/src/guestShare.ts
      - patches/**
      - tsconfig.base.json
      - .github/workflows/t3-code-ls.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: t3-code-ls-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: Native transport and application behavior
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: native/t3-code-ls
    steps:
      - name: Check out the exact public source
        working-directory: ${{ github.workspace }}
        env:
          SOURCE_REPOSITORY: ${{ github.repository }}
          SOURCE_REVISION: ${{ github.sha }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          git init .
          git remote add origin "https://github.com/${SOURCE_REPOSITORY}.git"
          git -c credential.helper= fetch --no-tags --depth=1 origin "$SOURCE_REVISION"
          git sparse-checkout set --cone native/t3-code-ls packages patches apps/server/src/orchestration-v2
          git checkout --detach FETCH_HEAD
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 26.12.1
      - name: Install the locked application test runtime
        run: node tools/install-server-tests.mjs
      - name: Fetch the immutable upstream comparison source
        run: |
          upstream_commit="$(python3 -c 'import json, re; value = json.load(open("upstream.lock.json"))["upstream"]["commit"]; assert re.fullmatch("[0-9a-f]{40}", value); print(value)')"
          git fetch --no-tags --depth 1 https://github.com/pingdotgg/t3code.git "$upstream_commit"
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt,clippy
      - name: Check the unchanged upstream README
        run: python3 tools/sync-readme.py
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check native code
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test native code
        run: cargo test --locked --all-targets
      - name: Compare permissions with the actual upstream functions
        run: node --disable-warning=ExperimentalWarning tools/check-permissions.mjs
      - name: Compare connection retry policy with the actual upstream functions
        run: node --disable-warning=ExperimentalWarning tools/check-connection.mjs
      - name: Compare provider capabilities with the actual upstream functions
        run: node --disable-warning=ExperimentalWarning tools/check-policy.mjs
      - name: Compare dispatch and goal policy with the actual upstream functions
        run: node --disable-warning=ExperimentalWarning tools/check-dispatch.mjs
      - name: Compare the guest share lifecycle with the actual upstream functions
        run: node --disable-warning=ExperimentalWarning tools/check-guest-share.mjs
      - name: Verify the bounded guest-share executable
        run: |
          cargo build --locked -p t3-code-ls-core --bin t3-code-ls-guest-share
          node --disable-warning=ExperimentalWarning tools/check-guest-share-runtime.mjs target/debug/t3-code-ls-guest-share
      - name: Compare project commands with the actual upstream planner
        run: node --disable-warning=ExperimentalWarning tools/check-project-commands.mjs
      - name: Verify the bounded project-command executable
        run: |
          cargo build --locked -p t3-code-ls-core --bin t3-code-ls-project
          node --disable-warning=ExperimentalWarning tools/check-project-runtime.mjs target/debug/t3-code-ls-project
      - name: Compare recovery events with the actual upstream functions
        run: |
          cargo build --locked -p t3-code-ls-core --example provider_recovery_matrix
          node --disable-warning=ExperimentalWarning tools/check-provider-recovery.mjs target/debug/examples/provider_recovery_matrix
      - name: Verify the bounded recovery executable
        run: |
          cargo build --locked -p t3-code-ls-core --bin t3-code-ls-recovery
          node --disable-warning=ExperimentalWarning tools/check-recovery-runtime.mjs target/debug/t3-code-ls-recovery
      - name: Verify JSON wire compatibility
        run: node tools/check-json.mjs
      - name: Exercise the provider subprocess protocol
        run: |
          cargo build --locked -p t3-code-ls-core --bin t3-code-ls-provider
          node tools/check-provider.mjs target/debug/t3-code-ls-provider
      - name: Test nightly selection and complete source comparison
        run: python3 -m unittest discover -s tools -p 'test_*.py'
      - name: Build the bridge executable
        run: cargo build --locked -p t3-code-ls-transport --bin t3-code-ls
      - name: Verify against the official nightly runtime
        run: |
          curl --fail --location --retry 3 \
            https://github.com/pingdotgg/t3code/releases/download/v0.1.8-nightly.20261108.4380/t3-0.1.8-nightly.20261108.4380-linux-x64.tar.gz \
            --output "$RUNNER_TEMP/t3-nightly-linux-x64.tar.gz"
          echo "f74b9d7157a7aa9468be39f06951e30669fb2ea36e4ad118449109e409b8d74e  $RUNNER_TEMP/t3-nightly-linux-x64.tar.gz" | sha256sum --check --
          python3 tools/verify-upstream.py \
            --archive "$RUNNER_TEMP/t3-nightly-linux-x64.tar.gz" \
            --output "$RUNNER_TEMP/t3-code-ls-upstream-verification.json"
      - name: Retain runtime verification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: t3-code-ls-upstream-verification
          path: ${{ runner.temp }}/t3-code-ls-upstream-verification.json
          if-no-files-found: ignore
          retention-days: 14

  lust:
    name: Pinned Lust compilation and behavioral parity
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: native/t3-code-ls
    steps:
      - name: Check out the exact public source
        working-directory: ${{ github.workspace }}
        env:
          SOURCE_REPOSITORY: ${{ github.repository }}
          SOURCE_REVISION: ${{ github.sha }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          git init .
          git remote add origin "https://github.com/${SOURCE_REPOSITORY}.git"
          git -c credential.helper= fetch --no-tags --depth=1 origin "$SOURCE_REVISION"
          git sparse-checkout set --cone native/t3-code-ls packages apps/server patches
          git checkout --detach FETCH_HEAD
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 26.12.1
      - name: Install the locked application test runtime
        run: node tools/install-server-tests.mjs
      - name: Fetch the immutable upstream comparison source
        run: |
          upstream_commit="$(python3 -c 'import json, re; value = json.load(open("upstream.lock.json"))["upstream"]["commit"]; assert re.fullmatch("[0-9a-f]{40}", value); print(value)')"
          git fetch --no-tags --depth 1 https://github.com/pingdotgg/t3code.git "$upstream_commit"
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal
      - name: Fetch the pinned Lust compiler
        run: |
          git init "$RUNNER_TEMP/lust-lang"
          git -C "$RUNNER_TEMP/lust-lang" remote add origin https://github.com/t3dotgg/lust-lang.git
          git -C "$RUNNER_TEMP/lust-lang" fetch --depth 1 origin 240e08d91d4aed0299639f6f11fd522912b248f9
          git -C "$RUNNER_TEMP/lust-lang" checkout --detach FETCH_HEAD
      - name: Compile and execute application code through Lust
        run: python3 tools/check-lust.py --source "$RUNNER_TEMP/lust-lang" --artifacts target/lust-bin
      - name: Typecheck the server-policy integration
        run: |
          tools/server-test-runtime/node_modules/.bin/effect-tsgo tsrs --noEmit --project tools/policy-tsconfig.json
      - name: Typecheck the actual Codex provider and session integration
        run: |
          tools/server-test-runtime/node_modules/.bin/effect-tsgo tsrs --noEmit --project tools/provider-tsconfig.json
      - name: Typecheck recovery and its production orchestration callers
        run: |
          tools/server-test-runtime/node_modules/.bin/effect-tsgo tsrs --noEmit --project tools/recovery-tsconfig.json
      - name: Typecheck guest sharing and its production callers
        run: |
          tools/server-test-runtime/node_modules/.bin/effect-tsgo tsrs --noEmit --project tools/guest-share-tsconfig.json
      - name: Typecheck project commands and their production callers
        run: |
          tools/server-test-runtime/node_modules/.bin/effect-tsgo tsrs --noEmit --project tools/project-tsconfig.json
      - name: Exercise the actual server-policy service with a Lust-built executable
        run: |
          mkdir -p target/lust
          node --disable-warning=ExperimentalWarning tools/check-policy.mjs "$PWD/target/lust-bin/t3-code-ls-policy"
          node --disable-warning=ExperimentalWarning tools/check-policy-adapter.mjs \
            "$PWD/target/lust-bin/t3-code-ls-policy" "$PWD/target/lust/policy-adapter-proof.json"
          node --disable-warning=ExperimentalWarning tools/check-dispatch.mjs \
            "$PWD/target/lust-bin/t3-code-ls-policy" --service "$PWD/target/lust/dispatch-proof.json"
          sha256sum target/lust-bin/t3-code-ls-policy
      - name: Exercise the actual Codex provider and session factory with Lust
        run: |
          node --disable-warning=ExperimentalWarning tools/check-provider-adapter.mjs \
            "$PWD/target/lust-bin/t3-code-ls-provider" "$PWD/target/lust/provider-adapter-proof.json"
      - name: Verify Lust recovery through the actual SQLite event sink
        run: |
          node --disable-warning=ExperimentalWarning tools/check-recovery-adapter.mjs \
            "$PWD/target/lust-bin/t3-code-ls-recovery" "$PWD/target/lust/recovery-adapter-proof.json"
      - name: Verify Lust guest sharing through the actual service and SQLite event sink
        run: |
          node --disable-warning=ExperimentalWarning tools/check-guest-share-adapter.mjs \
            "$PWD/target/lust-bin/t3-code-ls-guest-share" "$PWD/target/lust/guest-share-adapter-proof.json"
      - name: Verify Lust project commands through the actual service and SQLite event sink
        run: |
          node --disable-warning=ExperimentalWarning tools/check-project-adapter.mjs \
            "$PWD/target/lust-bin/t3-code-ls-project" "$PWD/target/lust/project-adapter-proof.json"
      - name: Package the verified Linux components with their receipt
        run: |
          tar -czf target/t3-code-ls-lust-linux-x64.tar.gz -C target lust-bin lust-proof.json lust/policy-adapter-proof.json lust/dispatch-proof.json lust/provider-adapter-proof.json lust/recovery-adapter-proof.json lust/guest-share-adapter-proof.json lust/project-adapter-proof.json
          sha256sum target/t3-code-ls-lust-linux-x64.tar.gz > target/t3-code-ls-lust-linux-x64.tar.gz.sha256
      - name: Retain the verified Linux Lust executables
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: t3-code-ls-lust-linux-x64
          path: |
            native/t3-code-ls/target/t3-code-ls-lust-linux-x64.tar.gz
            native/t3-code-ls/target/t3-code-ls-lust-linux-x64.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14
      - name: Retain Lust execution evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: t3-code-ls-lust-proof
          path: |
            native/t3-code-ls/target/lust-proof.json
            native/t3-code-ls/target/lust/policy-adapter-proof.json
            native/t3-code-ls/target/lust/dispatch-proof.json
            native/t3-code-ls/target/lust/provider-adapter-proof.json
            native/t3-code-ls/target/lust/recovery-adapter-proof.json
            native/t3-code-ls/target/lust/guest-share-adapter-proof.json
            native/t3-code-ls/target/lust/project-adapter-proof.json
            native/t3-code-ls/tools/server-test-runtime/package-lock.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Retain the verified Lust policy executable
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: t3-code-ls-policy-linux-x64
          path: native/t3-code-ls/target/lust-bin/t3-code-ls-policy
          if-no-files-found: error
          retention-days: 14

  portable-core:
    name: Portable core target checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: native/t3-code-ls
    steps:
      - name: Check out the exact public source
        working-directory: ${{ github.workspace }}
        env:
          SOURCE_REPOSITORY: ${{ github.repository }}
          SOURCE_REVISION: ${{ github.sha }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          git init .
          git remote add origin "https://github.com/${SOURCE_REPOSITORY}.git"
          git -c credential.helper= fetch --no-tags --depth=1 origin "$SOURCE_REVISION"
          git sparse-checkout set --cone native/t3-code-ls packages/contracts packages/client-runtime apps/server/src/orchestration-v2
          git checkout --detach FETCH_HEAD
      - name: Install mobile, Windows, and WebAssembly standard libraries
        run: |
          rustup toolchain install 1.99.1 --profile minimal
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim aarch64-linux-android x86_64-pc-windows-gnu wasm32-unknown-unknown
      - name: Check the core on each target
        run: |
          for target in aarch64-apple-ios aarch64-apple-ios-sim aarch64-linux-android x86_64-pc-windows-gnu wasm32-unknown-unknown; do
            cargo check --locked -p t3-code-ls-core --target "$target"
          done
