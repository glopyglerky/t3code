name: t3 code ls upstream watch

on:
  schedule:
    - cron: "8 */2 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/t3-code-ls-upstream.yml
      - native/t3-code-ls/tools/nightly.py
      - native/t3-code-ls/tools/activity.py
      - native/t3-code-ls/upstream.lock.json

permissions:
  contents: read

concurrency:
  group: t3-code-ls-upstream-watch
  cancel-in-progress: false

jobs:
  watch:
    name: Published nightly and upstream activity
    if: github.repository == 'glopyglerky/t3code' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Restore the completed activity cursor
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: native/t3-code-ls/target/upstream-activity-state.json
          key: t3-code-ls-activity-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: t3-code-ls-activity-v1-
      - name: Compare the published nightly with the pinned source
        run: |
          python3 native/t3-code-ls/tools/nightly.py check \
            --repo-root . --lock native/t3-code-ls/upstream.lock.json \
            --output "$RUNNER_TEMP/t3-code-ls-nightly.json" --fetch
      - name: Track changed PRs and issues
        id: activity
        run: |
          python3 native/t3-code-ls/tools/activity.py \
            --state native/t3-code-ls/target/upstream-activity-state.json \
            --output "$RUNNER_TEMP/t3-code-ls-activity.json" \
            --lookback-hours 24 --max-items 1000 --overlap-minutes 60 --details none
      - name: Save the completed activity cursor
        if: steps.activity.outcome == 'success'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: native/t3-code-ls/target/upstream-activity-state.json
          key: t3-code-ls-activity-v1-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Retain read-only monitoring reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: t3-code-ls-upstream-watch
          path: |
            ${{ runner.temp }}/t3-code-ls-nightly.json
            ${{ runner.temp }}/t3-code-ls-activity.json
            native/t3-code-ls/target/upstream-activity-state.json
          if-no-files-found: warn
          retention-days: 30
