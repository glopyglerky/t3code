name: Rust components with native Lust and pinned rustc

on:
  workflow_call:
    inputs:
      packages:
        type: string
        default: '["t3-code-ls-app","t3-code-ls-core","t3-code-ls-storage","t3-code-ls-transport","t3code-ls-tools"]'
      component_tests:
        type: string
        default: "[]"
      source_guards:
        type: boolean
        default: true
      stage_native:
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      packages:
        description: JSON array of Rust packages to qualify
        type: string
        default: '["t3-code-ls-app","t3-code-ls-core","t3-code-ls-storage","t3-code-ls-transport","t3code-ls-tools"]'
      component_tests:
        description: JSON array of mapped component acceptance scripts
        type: string
        default: "[]"
      source_guards:
        description: Validate migration accounting
        type: boolean
        default: true
      stage_native:
        description: Stage the complete production helper bundle
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      GIT_TERMINAL_PROMPT: "0"
      CI_RUST_PACKAGES: ${{ inputs.packages }}
      CI_COMPONENT_TESTS: ${{ inputs.component_tests }}
      T3_CODE_LS_COMPILER: rustc
      RUSTUP_TOOLCHAIN: 1.99.1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 26.12.1
      - name: Select isolated generated output and cache scope
        id: scope
        run: |
          echo "CARGO_TARGET_DIR=$RUNNER_TEMP/t3code-ls-cargo" >> "$GITHUB_ENV"
          echo "CARGO_HOME=$RUNNER_TEMP/t3code-ls-cargo-home" >> "$GITHUB_ENV"
          python3 - <<'PY'
          import hashlib, json, os
          packages = json.loads(os.environ["CI_RUST_PACKAGES"])
          scope = hashlib.sha256(json.dumps(sorted(packages)).encode()).hexdigest()[:16]
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"key={scope}\n")
          PY
      - name: Install pinned rustc for code outside the Lust subset
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: 1.99.1
      - name: Cache Cargo sources and selected build outputs
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ${{ env.CARGO_HOME }}/registry
            ${{ env.CARGO_HOME }}/git
            ${{ env.CARGO_TARGET_DIR }}
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('toolchain.lock.json', 'rust-toolchain.toml', 'Cargo.lock') }}-${{ steps.scope.outputs.key }}-${{ hashFiles('crates/**', 'tools/src/**', '**/*.rs', '**/Cargo.toml', '.cargo/**') }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('toolchain.lock.json', 'rust-toolchain.toml', 'Cargo.lock') }}-${{ steps.scope.outputs.key }}-
      - name: Fetch immutable migration source references
        if: inputs.source_guards || inputs.stage_native
        run: node tools/fetch-migration-sources.mjs
      - name: Test selected Rust packages and reverse consumers
        run: python3 tools/test-rust.py --packages "$CI_RUST_PACKAGES"
      - name: Validate source retention and upstream provenance
        if: inputs.source_guards
        run: |
          cargo run --locked -p t3code-ls-tools -- check-source
          cargo run --locked -p t3code-ls-tools -- check-upstream-readme
      - name: Cache component test dependency downloads
        if: inputs.component_tests != '[]' || inputs.stage_native
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.npm
          key: component-npm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/server-test-runtime/package-lock.json') }}
      - name: Install the locked component acceptance runtime
        if: inputs.component_tests != '[]' || inputs.stage_native
        run: |
          echo "T3_CODE_LS_TEST_RUNTIME=$RUNNER_TEMP/component-test-runtime" >> "$GITHUB_ENV"
          T3_CODE_LS_TEST_RUNTIME="$RUNNER_TEMP/component-test-runtime" node tools/install-server-tests.mjs
      - name: Run selected mapped component acceptance checks
        if: inputs.component_tests != '[]'
        run: node tools/check-acceptance.mjs --tests "$CI_COMPONENT_TESTS" --proof-directory "$RUNNER_TEMP/component-proof"
      - name: Retain component acceptance evidence
        if: always() && inputs.component_tests != '[]'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: component-acceptance-proof
          path: ${{ runner.temp }}/component-proof/
          if-no-files-found: warn
          retention-days: 14
      - name: Fetch the unchanged pinned native Lust source
        if: inputs.stage_native
        run: |
          revision="$(node -p 'JSON.parse(require("node:fs").readFileSync("lust-toolchain.json", "utf8")).revision')"
          [[ "$revision" =~ ^[0-9a-f]{40}$ ]]
          git init "$RUNNER_TEMP/lust-source"
          git -C "$RUNNER_TEMP/lust-source" fetch --no-tags --depth=1 https://github.com/glopyglerky/lustr.git "$revision"
          git -C "$RUNNER_TEMP/lust-source" checkout --detach FETCH_HEAD
      - name: Check native Lust coverage and qualify supported application code
        if: inputs.stage_native
        run: |
          python3 tools/check-lust.py --source "$RUNNER_TEMP/lust-source" --receipt "$RUNNER_TEMP/lust-native-proof.json" --artifacts "$RUNNER_TEMP/lust-components" --allow-unsupported-fallback
          node --input-type=module <<'JS'
          import fs from "node:fs";
          import path from "node:path";
          const receiptPath = path.join(process.env.RUNNER_TEMP, "lust-native-proof.json");
          const receipt = JSON.parse(fs.readFileSync(receiptPath, "utf8"));
          if (receipt.status === "passed") {
            fs.appendFileSync(process.env.GITHUB_ENV,
              `T3_CODE_LS_LUST_DIR=${path.join(process.env.RUNNER_TEMP, "lust-components")}\nT3_CODE_LS_LUST_RECEIPT=${receiptPath}\n`);
            console.log("Using the native Lust application artifacts qualified by this receipt.");
          } else if (receipt.status === "unsupported" &&
              (receipt.artifacts === undefined || (Array.isArray(receipt.artifacts) && receipt.artifacts.length === 0))) {
            const message = "The pinned native Lust compiler reports unsupported application code. This build uses the pinned rustc route for those helpers; no native Lust application artifacts are claimed.";
            console.log(message);
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${message}\n`);
          } else {
            throw new Error("Native Lust qualification did not produce a passed or artifact-free unsupported receipt");
          }
          JS
      - name: Stage the complete application helper bundle
        if: inputs.stage_native
        run: node tools/build-native.mjs
      - name: Retain exact adapter binaries and manifest
        if: inputs.stage_native
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: hybrid-native-binaries
          path: bin/
          if-no-files-found: error
          retention-days: 14
      - name: Retain compiler identity
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: compiler-route-proof
          path: |
            toolchain.lock.json
            lust-toolchain.json
            ${{ runner.temp }}/lust-native-proof.json
          if-no-files-found: warn
          retention-days: 14
