name: Rust components with packaged Lustr and BlueFe

on:
  workflow_call:
    outputs:
      native_artifact:
        description: Exact successful native job's release bundle artifact
        value: ${{ jobs.qualify.outputs.native_artifact }}
    inputs:
      packages:
        type: string
        default: '["t3-code-ls-app","t3-code-ls-core","t3-code-ls-storage","t3-code-ls-transport","t3code-ls-tools"]'
      component_tests:
        type: string
        default: "[]"
      source_guards:
        type: boolean
        default: true
      stage_native:
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      packages:
        description: JSON array of Rust packages to qualify
        type: string
        default: '["t3-code-ls-app","t3-code-ls-core","t3-code-ls-storage","t3-code-ls-transport","t3code-ls-tools"]'
      component_tests:
        description: JSON array of mapped component acceptance scripts
        type: string
        default: "[]"
      source_guards:
        description: Validate migration accounting
        type: boolean
        default: true
      stage_native:
        description: Stage the complete production helper bundle
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ${{ ((github.event_name != 'pull_request' && github.event_name != 'pull_request_target') || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON(vars.CI_RUNNER_ROUTES || '{}')['ubuntu-24.04'] || 'ubuntu-24.04' }}
    timeout-minutes: 30
    outputs:
      native_artifact: ${{ steps.scope.outputs.native_artifact }}
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      GIT_TERMINAL_PROMPT: "0"
      CI_RUST_PACKAGES: ${{ inputs.packages }}
      CI_COMPONENT_TESTS: ${{ inputs.component_tests }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 26.12.1
      - name: Select isolated generated output and cache scope
        id: scope
        run: |
          echo "CARGO_TARGET_DIR=$RUNNER_TEMP/t3code-ls-cargo" >> "$GITHUB_ENV"
          echo "CARGO_HOME=$RUNNER_TEMP/t3code-ls-cargo-home" >> "$GITHUB_ENV"
          echo "native_artifact=hybrid-native-binaries-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
          python3 - <<'PY'
          import hashlib, json, os
          packages = json.loads(os.environ["CI_RUST_PACKAGES"])
          scope = hashlib.sha256(json.dumps(sorted(packages)).encode()).hexdigest()[:16]
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"key={scope}\n")
          PY
      - name: Cache immutable compiler downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          key: bluefe-package-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('toolchain.lock.json') }}
          path: |
            ${{ runner.temp }}/t3code-ls-toolchains/preview-2026.11.09-2/bluefe-lustr-preview-2026.11.09-2-x86_64-unknown-linux-gnu.tar.zst
            ${{ runner.temp }}/t3code-ls-toolchains/preview-2026.11.09-2/source-components.json
            ${{ runner.temp }}/t3code-ls-toolchains/preview-2026.11.09-2/payload-manifest.json
            ${{ runner.temp }}/t3code-ls-toolchains/preview-2026.11.09-2/platform.json
            ${{ runner.temp }}/t3code-ls-toolchains/preview-2026.11.09-2/qualification.json
            ${{ runner.temp }}/t3code-ls-toolchains/preview-2026.11.09-2/SHA256SUMS
      - name: Install and verify the pinned compiler package
        run: node tools/install-toolchain.mjs --destination "$RUNNER_TEMP/t3code-ls-toolchains/preview-2026.11.09-2"
      - name: Cache Cargo sources and selected build outputs
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ${{ env.CARGO_HOME }}/registry
            ${{ env.CARGO_HOME }}/git
            ${{ env.CARGO_TARGET_DIR }}
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('toolchain.lock.json', 'rust-toolchain.toml', 'Cargo.lock') }}-${{ steps.scope.outputs.key }}-${{ hashFiles('crates/**', 'tools/src/**', '**/*.rs', '**/Cargo.toml', '.cargo/**') }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('toolchain.lock.json', 'rust-toolchain.toml', 'Cargo.lock') }}-${{ steps.scope.outputs.key }}-
      - name: Fetch immutable migration source references
        if: inputs.source_guards
        run: node tools/fetch-migration-sources.mjs
      - name: Test selected Rust packages and reverse consumers
        run: python3 tools/test-rust.py --packages "$CI_RUST_PACKAGES"
      - name: Validate source retention and upstream provenance
        if: inputs.source_guards
        run: |
          "$T3_CODE_LS_TOOLCHAIN/bin/lustr" --bluefe-root "$T3_CODE_LS_TOOLCHAIN" run --locked -p t3code-ls-tools -- check-source
          "$T3_CODE_LS_TOOLCHAIN/bin/lustr" --bluefe-root "$T3_CODE_LS_TOOLCHAIN" run --locked -p t3code-ls-tools -- check-upstream-readme
      - name: Cache component test dependency downloads
        if: inputs.component_tests != '[]'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.npm
          key: component-npm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/server-test-runtime/package-lock.json') }}
      - name: Install the locked component acceptance runtime
        if: inputs.component_tests != '[]'
        run: |
          echo "T3_CODE_LS_TEST_RUNTIME=$RUNNER_TEMP/component-test-runtime" >> "$GITHUB_ENV"
          T3_CODE_LS_TEST_RUNTIME="$RUNNER_TEMP/component-test-runtime" node tools/install-server-tests.mjs
      - name: Run selected mapped component acceptance checks
        if: inputs.component_tests != '[]'
        run: node tools/check-acceptance.mjs --tests "$CI_COMPONENT_TESTS" --proof-directory "$RUNNER_TEMP/component-proof"
      - name: Retain component acceptance evidence
        if: always() && inputs.component_tests != '[]'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: component-acceptance-proof-${{ github.run_attempt }}
          path: ${{ runner.temp }}/component-proof/
          if-no-files-found: warn
          retention-days: 14
      - name: Stage the complete application helper bundle
        if: inputs.stage_native
        run: node tools/build-native.mjs
      - name: Retain exact adapter binaries and manifest
        if: inputs.stage_native
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ steps.scope.outputs.native_artifact }}
          path: bin/
          if-no-files-found: error
          retention-days: 14
      - name: Retain compiler identity
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: packaged-toolchain-proof-${{ github.run_attempt }}
          path: |
            toolchain.lock.json
            lust-toolchain.json
            ${{ runner.temp }}/t3code-ls-toolchains/preview-2026.11.09-2/installation-proof.json
          if-no-files-found: warn
          retention-days: 14
