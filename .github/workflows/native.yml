name: Rust components with packaged Lustr and BlueFe

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      GIT_TERMINAL_PROMPT: "0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 26.12.1

      - name: Select isolated generated output
        run: |
          echo "CARGO_TARGET_DIR=$RUNNER_TEMP/t3code-ls-cargo" >> "$GITHUB_ENV"

      - name: Test compiler packages, host launchers and immutable source fetching
        run: node --test tools/install-toolchain.test.mjs tools/native-packaging.test.mjs tools/fetch-migration-sources.test.mjs

      - name: Test immutable upstream and translated-code impact reporting
        run: python3 -m unittest discover -s tools -p test_nightly.py

      - name: Cache immutable compiler downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          key: bluefe-package-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('toolchain.lock.json') }}
          path: |
            ${{ runner.temp }}/t3code-ls-toolchains/preview-2026.11.09-2/bluefe-lustr-preview-2026.11.09-2-x86_64-unknown-linux-gnu.tar.zst
            ${{ runner.temp }}/t3code-ls-toolchains/preview-2026.11.09-2/source-components.json
            ${{ runner.temp }}/t3code-ls-toolchains/preview-2026.11.09-2/payload-manifest.json
            ${{ runner.temp }}/t3code-ls-toolchains/preview-2026.11.09-2/platform.json
            ${{ runner.temp }}/t3code-ls-toolchains/preview-2026.11.09-2/qualification.json
            ${{ runner.temp }}/t3code-ls-toolchains/preview-2026.11.09-2/SHA256SUMS

      - name: Install and verify the pinned compiler package
        id: toolchain
        run: node tools/install-toolchain.mjs --destination "$RUNNER_TEMP/t3code-ls-toolchains/preview-2026.11.09-2"

      - name: Fetch the immutable integrated history and recovery references
        run: node tools/fetch-migration-sources.mjs

      - name: Test Rust components and migration guards
        run: |
          "$T3_CODE_LS_TOOLCHAIN/bin/lustr" --bluefe-root "$T3_CODE_LS_TOOLCHAIN" test --locked --workspace --all-targets
          "$T3_CODE_LS_TOOLCHAIN/bin/lustr" --bluefe-root "$T3_CODE_LS_TOOLCHAIN" run --locked -p t3code-ls-tools -- check-source
          "$T3_CODE_LS_TOOLCHAIN/bin/lustr" --bluefe-root "$T3_CODE_LS_TOOLCHAIN" run --locked -p t3code-ls-tools -- check-upstream-readme

      - name: Stage core binaries for actual application adapters
        run: node tools/build-native.mjs

      - name: Retain exact adapter binaries and manifest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: hybrid-native-binaries
          path: bin/
          if-no-files-found: error
          retention-days: 14

      - name: Retain compiler identity
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: packaged-toolchain-proof
          path: |
            toolchain.lock.json
            lust-toolchain.json
            ${{ runner.temp }}/t3code-ls-toolchains/preview-2026.11.09-2/installation-proof.json
          if-no-files-found: warn
          retention-days: 14
