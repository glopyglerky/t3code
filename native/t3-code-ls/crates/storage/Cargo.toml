[package]
name = "t3-code-ls-storage"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
regex = "=1.13.1"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.11.1"
surrealdb = { version = "=4.0.0", default-features = false, features = ["protocol-ws", "rustls"] }
tokio = { version = "=1.54.1", features = ["macros", "rt-multi-thread", "sync", "process", "io-util", "time"] }
t3-code-ls-core = { path = "../core" }
unicode-segmentation = "=1.13.3"
url = "=2.5.8"

[dev-dependencies]
getrandom = "=0.4.3"
tempfile = "=3.27.0"

[lints]
workspace = true
