[package]
name = "t3-code-ls-storage"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
regex = "=1.13.1"
# omdb retains redb's package name and on-disk compatibility. Pin the fork to an
# immutable revision; never silently resolve the upstream crates.io package.
redb = { version = "=4.5.0", git = "https://github.com/glopyglerky/omdb", rev = "b2ff031398b1f0a793a352db7a699575b5d4d3d4" }
same-file = "=1.0.6"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.11.1"
tokio = { version = "=1.54.1", features = [
  "macros",
  "rt-multi-thread",
  "sync",
  "process",
  "io-util",
  "time",
] }
t3-code-ls-core = { path = "../core" }
unicode-segmentation = "=1.13.3"
url = "=2.5.8"

[dev-dependencies]
getrandom = "=0.4.3"
tempfile = "=3.27.0"

[lints]
workspace = true
