[workspace]
members = ["crates/core", "crates/transport", "crates/storage", "crates/app", "crates/orchestration", "tools"]
default-members = ["crates/core", "crates/transport", "crates/app"]
exclude = ["native/hyprland-snap-shot", "native/resource-monitor"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
